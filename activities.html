<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recallify - Learn once. Remember forever.</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 12px;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #a0a0a0;
            font-size: 1.1em;
        }

        .add-section {
            background: #1a1a2e;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 40px;
            border: 1px solid #2a2a3e;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #b0b0b0;
            font-weight: 500;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 12px;
            background: #0a0a0a;
            border: 1px solid #3a3a4e;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
            font-family: inherit;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #2a2a3e;
            color: #e0e0e0;
        }

        .btn-secondary:hover {
            background: #3a3a4e;
        }

        .dashboard {
            margin-top: 40px;
        }

        .dashboard h2 {
            margin-bottom: 20px;
            color: #ffffff;
        }

        .topic-card {
            background: #1a1a2e;
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #2a2a3e;
            transition: transform 0.2s;
        }

        .topic-card:hover {
            transform: translateY(-2px);
            border-color: #3a3a4e;
        }

        .topic-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .topic-name {
            font-size: 1.3em;
            font-weight: 600;
            color: #ffffff;
        }

        .days-passed {
            background: #2a2a3e;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.9em;
            color: #a0a0a0;
        }

        .revision-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .revision-btn {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .revision-btn.unlocked {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .revision-btn.unlocked:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .revision-btn.locked {
            background: #2a2a3e;
            color: #5a5a6e;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1a1a2e;
            padding: 40px;
            border-radius: 12px;
            max-width: 600px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid #3a3a4e;
        }

        .modal-header {
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 1.8em;
            margin-bottom: 10px;
            color: #ffffff;
        }

        .revision-day-badge {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.9em;
        }

        .modal-notes {
            background: #0a0a0a;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            border: 1px solid #2a2a3e;
            white-space: pre-wrap;
            line-height: 1.8;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6a6a7a;
        }

        .empty-state-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2em;
            }

            .topic-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .revision-buttons {
                width: 100%;
            }

            .revision-btn {
                flex: 1;
                min-width: 70px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Recallify</h1>
            <p class="subtitle">Learn once. Remember forever.</p>
        </header>

        <div class="add-section">
            <h2 style="margin-bottom: 20px; color: #ffffff;">Add Study Topic</h2>
            <form id="addTopicForm">
                <div class="form-group">
                    <label for="topicName">Topic Name *</label>
                    <input type="text" id="topicName" placeholder="e.g., Two Pointers Algorithm" required>
                </div>
                <div class="form-group">
                    <label for="topicNotes">Study Notes *</label>
                    <textarea id="topicNotes" placeholder="Write your notes here..." required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Add Topic</button>
            </form>
        </div>

        <div class="dashboard">
            <h2>My Study Topics</h2>
            <div id="topicsList"></div>
        </div>
    </div>

    <div id="revisionModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTopicName"></h3>
                <span class="revision-day-badge" id="modalRevisionDay"></span>
            </div>
            <div class="modal-notes" id="modalNotes"></div>
            <button class="btn btn-secondary" onclick="closeModal()">Close</button>
        </div>
    </div>

    <script>
        const REVISION_DAYS = [1, 3, 7, 14, 30];

        function loadTopics() {
            const topics = JSON.parse(localStorage.getItem('recallifyTopics') || '[]');
            return topics;
        }

        function saveTopics(topics) {
            localStorage.setItem('recallifyTopics', JSON.stringify(topics));
        }

        function calculateDaysPassed(createdDate) {
            const created = new Date(createdDate);
            const now = new Date();
            const diffTime = Math.abs(now - created);
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            return diffDays;
        }

        function isRevisionUnlocked(daysPassed, revisionDay) {
            return daysPassed >= revisionDay;
        }

        function renderTopics() {
            const topics = loadTopics();
            const container = document.getElementById('topicsList');

            if (topics.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📚</div>
                        <h3>No topics yet</h3>
                        <p>Add your first study topic to get started!</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = topics.map(topic => {
                const daysPassed = calculateDaysPassed(topic.createdDate);
                
                const revisionButtons = REVISION_DAYS.map(day => {
                    const unlocked = isRevisionUnlocked(daysPassed, day);
                    return `
                        <button 
                            class="revision-btn ${unlocked ? 'unlocked' : 'locked'}"
                            ${unlocked ? `onclick="openRevisionModal(${topic.id}, ${day})"` : 'disabled'}
                        >
                            Day ${day}
                        </button>
                    `;
                }).join('');

                return `
                    <div class="topic-card">
                        <div class="topic-header">
                            <div class="topic-name">${topic.topic}</div>
                            <div class="days-passed">Day ${daysPassed}</div>
                        </div>
                        <div class="revision-buttons">
                            ${revisionButtons}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openRevisionModal(topicId, revisionDay) {
            const topics = loadTopics();
            const topic = topics.find(t => t.id === topicId);
            
            if (!topic) return;

            document.getElementById('modalTopicName').textContent = topic.topic;
            document.getElementById('modalRevisionDay').textContent = `Revision Day ${revisionDay}`;
            document.getElementById('modalNotes').textContent = topic.notes;
            document.getElementById('revisionModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('revisionModal').classList.remove('active');
        }

        document.getElementById('addTopicForm').addEventListener('submit', (e) => {
            e.preventDefault();

            const topicName = document.getElementById('topicName').value.trim();
            const topicNotes = document.getElementById('topicNotes').value.trim();

            if (!topicName || !topicNotes) {
                alert('Please fill in all fields');
                return;
            }

            const topics = loadTopics();
            const newTopic = {
                id: Date.now(),
                topic: topicName,
                notes: topicNotes,
                createdDate: new Date().toISOString()
            };

            topics.unshift(newTopic);
            saveTopics(topics);

            document.getElementById('topicName').value = '';
            document.getElementById('topicNotes').value = '';

            renderTopics();
        });

        document.getElementById('revisionModal').addEventListener('click', (e) => {
            if (e.target.id === 'revisionModal') {
                closeModal();
            }
        });

        renderTopics();
    </script>
</body>
</html>
