<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recallify - Learn once. Remember forever.</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 12px;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #a0a0a0;
            font-size: 1.1em;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #2a2a3e;
        }

        .tab-btn {
            padding: 12px 24px;
            background: transparent;
            border: none;
            color: #a0a0a0;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
            font-weight: 500;
        }

        .tab-btn:hover {
            color: #e0e0e0;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .add-section {
            background: #1a1a2e;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #2a2a3e;
            max-width: 700px;
            margin: 0 auto;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #b0b0b0;
            font-weight: 500;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 12px;
            background: #0a0a0a;
            border: 1px solid #3a3a4e;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
            font-family: inherit;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #2a2a3e;
            color: #e0e0e0;
        }

        .btn-secondary:hover {
            background: #3a3a4e;
        }

        .months-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .month-card {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 24px;
            border-radius: 12px;
            border: 1px solid #2a2a3e;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .month-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .month-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.3);
            border-color: #667eea;
        }

        .month-name {
            font-size: 1.6em;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 12px;
        }

        .month-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #a0a0a0;
            font-size: 0.95em;
        }

        .topics-count {
            background: #2a2a3e;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 600;
        }

        .month-details {
            margin-top: 40px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #2a2a3e;
            padding: 10px 20px;
            border-radius: 8px;
            color: #e0e0e0;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            font-size: 1em;
            margin-bottom: 20px;
        }

        .back-btn:hover {
            background: #3a3a4e;
            transform: translateX(-4px);
        }

        .month-header-detail {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            border: 1px solid #2a2a3e;
        }

        .month-title-detail {
            font-size: 2.2em;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .month-summary {
            color: #a0a0a0;
            font-size: 1.05em;
        }

        .topic-card {
            background: #1a1a2e;
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 16px;
            border: 1px solid #2a2a3e;
            transition: transform 0.2s;
        }

        .topic-card:hover {
            transform: translateY(-2px);
            border-color: #3a3a4e;
        }

        .topic-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .topic-name {
            font-size: 1.3em;
            font-weight: 600;
            color: #ffffff;
        }

        .topic-date {
            background: #2a2a3e;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.9em;
            color: #a0a0a0;
        }

        .days-passed {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85em;
            font-weight: 600;
            margin-top: 10px;
            display: inline-block;
        }

        .revision-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 16px;
        }

        .revision-btn {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .revision-btn.unlocked {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .revision-btn.unlocked:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .revision-btn.locked {
            background: #2a2a3e;
            color: #5a5a6e;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1a1a2e;
            padding: 40px;
            border-radius: 12px;
            max-width: 600px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid #3a3a4e;
        }

        .modal-header {
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 1.8em;
            margin-bottom: 10px;
            color: #ffffff;
        }

        .revision-day-badge {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.9em;
        }

        .modal-notes {
            background: #0a0a0a;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            border: 1px solid #2a2a3e;
            white-space: pre-wrap;
            line-height: 1.8;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6a6a7a;
        }

        .empty-state-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2em;
            }

            .months-grid {
                grid-template-columns: 1fr;
            }

            .topic-meta {
                flex-direction: column;
                align-items: flex-start;
            }

            .revision-buttons {
                width: 100%;
            }

            .revision-btn {
                flex: 1;
                min-width: 70px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Recallify</h1>
            <p class="subtitle">Learn once. Remember forever.</p>
        </header>

        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('add')">➕ Add Topic</button>
            <button class="tab-btn" onclick="switchTab('topics')">📚 My Topics</button>
        </div>

        <div id="addTab" class="tab-content active">
            <div class="add-section">
                <h2 style="margin-bottom: 20px; color: #ffffff;">Add Study Topic</h2>
                <form id="addTopicForm">
                    <div class="form-group">
                        <label for="topicName">Topic Name *</label>
                        <input type="text" id="topicName" placeholder="e.g., Two Pointers Algorithm" required>
                    </div>
                    <div class="form-group">
                        <label for="topicNotes">Study Notes *</label>
                        <textarea id="topicNotes" placeholder="Write your notes here..." required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Add Topic</button>
                </form>
            </div>
        </div>

        <div id="topicsTab" class="tab-content">
            <div id="monthsView">
                <div id="monthsGrid" class="months-grid"></div>
            </div>

            <div id="monthDetailView" class="month-details hidden">
                <button class="back-btn" onclick="backToMonths()">
                    ← Back to All Months
                </button>
                <div id="monthDetailContent"></div>
            </div>
        </div>
    </div>

    <div id="revisionModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTopicName"></h3>
                <span class="revision-day-badge" id="modalRevisionDay"></span>
            </div>
            <div class="modal-notes" id="modalNotes"></div>
            <button class="btn btn-secondary" onclick="closeModal()">Close</button>
        </div>
    </div>

    <script>
        const REVISION_DAYS = [ 3, 7, 14, 30];

        function loadTopics() {
            const topics = JSON.parse(localStorage.getItem('recallifyTopics') || '[]');
            return topics;
        }

        function saveTopics(topics) {
            localStorage.setItem('recallifyTopics', JSON.stringify(topics));
        }

        function calculateDaysPassed(createdDate) {
            const created = new Date(createdDate);
            const now = new Date();
            const diffTime = Math.abs(now - created);
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            return diffDays;
        }

        function isRevisionUnlocked(daysPassed, revisionDay) {
            return daysPassed >= revisionDay;
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            const options = { day: 'numeric', month: 'short', year: 'numeric' };
            return date.toLocaleDateString('en-US', options);
        }

        function getMonthYear(dateString) {
            const date = new Date(dateString);
            const options = { month: 'long', year: 'numeric' };
            return date.toLocaleDateString('en-US', options);
        }

        function groupTopicsByMonth(topics) {
            const grouped = {};
            
            topics.forEach(topic => {
                const monthYear = getMonthYear(topic.createdDate);
                if (!grouped[monthYear]) {
                    grouped[monthYear] = [];
                }
                grouped[monthYear].push(topic);
            });

            return grouped;
        }

        function renderMonthsGrid() {
            const topics = loadTopics();
            const container = document.getElementById('monthsGrid');

            if (topics.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📚</div>
                        <h3>No topics yet</h3>
                        <p>Add your first study topic to get started!</p>
                    </div>
                `;
                return;
            }

            const groupedTopics = groupTopicsByMonth(topics);
            
            container.innerHTML = Object.entries(groupedTopics)
                .sort((a, b) => new Date(b[1][0].createdDate) - new Date(a[1][0].createdDate))
                .map(([monthYear, monthTopics]) => {
                    return `
                        <div class="month-card" onclick="showMonthDetail('${monthYear}')">
                            <div class="month-name">${monthYear}</div>
                            <div class="month-stats">
                                <span class="topics-count">${monthTopics.length} topic${monthTopics.length !== 1 ? 's' : ''}</span>
                                <span>📅</span>
                            </div>
                        </div>
                    `;
                }).join('');
        }

        function showMonthDetail(monthYear) {
            const topics = loadTopics();
            const groupedTopics = groupTopicsByMonth(topics);
            const monthTopics = groupedTopics[monthYear];

            if (!monthTopics) return;

            const topicsHtml = monthTopics
                .sort((a, b) => new Date(b.createdDate) - new Date(a.createdDate))
                .map(topic => {
                    const daysPassed = calculateDaysPassed(topic.createdDate);
                    
                    const revisionButtons = REVISION_DAYS.map(day => {
                        const unlocked = isRevisionUnlocked(daysPassed, day);
                        return `
                            <button 
                                class="revision-btn ${unlocked ? 'unlocked' : 'locked'}"
                                ${unlocked ? `onclick="openRevisionModal(${topic.id}, ${day})"` : 'disabled'}
                            >
                                Day ${day}
                            </button>
                        `;
                    }).join('');

                    return `
                        <div class="topic-card">
                            <div class="topic-meta">
                                <div class="topic-name">${topic.topic}</div>
                                <div class="topic-date">📅 ${formatDate(topic.createdDate)}</div>
                            </div>
                            <div class="days-passed">Day ${daysPassed} since creation</div>
                            <div class="revision-buttons">
                                ${revisionButtons}
                            </div>
                        </div>
                    `;
                }).join('');

            document.getElementById('monthDetailContent').innerHTML = `
                <div class="month-header-detail">
                    <div class="month-title-detail">${monthYear}</div>
                    <div class="month-summary">${monthTopics.length} topic${monthTopics.length !== 1 ? 's' : ''} • Total study activities this month</div>
                </div>
                ${topicsHtml}
            `;

            document.getElementById('monthsView').classList.add('hidden');
            document.getElementById('monthDetailView').classList.remove('hidden');
        }

        function backToMonths() {
            document.getElementById('monthsView').classList.remove('hidden');
            document.getElementById('monthDetailView').classList.add('hidden');
        }

        function openRevisionModal(topicId, revisionDay) {
            const topics = loadTopics();
            const topic = topics.find(t => t.id === topicId);
            
            if (!topic) return;

            document.getElementById('modalTopicName').textContent = topic.topic;
            document.getElementById('modalRevisionDay').textContent = `Revision Day ${revisionDay}`;
            document.getElementById('modalNotes').textContent = topic.notes;
            document.getElementById('revisionModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('revisionModal').classList.remove('active');
        }

        function switchTab(tabName) {
            const tabs = document.querySelectorAll('.tab-content');
            const buttons = document.querySelectorAll('.tab-btn');
            
            tabs.forEach(tab => tab.classList.remove('active'));
            buttons.forEach(btn => btn.classList.remove('active'));

            if (tabName === 'add') {
                document.getElementById('addTab').classList.add('active');
                buttons[0].classList.add('active');
            } else {
                document.getElementById('topicsTab').classList.add('active');
                buttons[1].classList.add('active');
                backToMonths();
                renderMonthsGrid();
            }
        }

        document.getElementById('addTopicForm').addEventListener('submit', (e) => {
            e.preventDefault();

            const topicName = document.getElementById('topicName').value.trim();
            const topicNotes = document.getElementById('topicNotes').value.trim();

            if (!topicName || !topicNotes) {
                alert('Please fill in all fields');
                return;
            }

            const topics = loadTopics();
            const newTopic = {
                id: Date.now(),
                topic: topicName,
                notes: topicNotes,
                createdDate: new Date().toISOString()
            };

            topics.push(newTopic);
            saveTopics(topics);

            document.getElementById('topicName').value = '';
            document.getElementById('topicNotes').value = '';

            alert('✅ Topic added successfully!');
            switchTab('topics');
        });

        document.getElementById('revisionModal').addEventListener('click', (e) => {
            if (e.target.id === 'revisionModal') {
                closeModal();
            }
        });
    </script>
</body>
</html>
