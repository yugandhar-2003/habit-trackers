<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <!-- Updated title for 2026 calendar -->
  <title>2026 Calendar Habit Tracker</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="bg-blur blob-1"></div>
  <div class="bg-blur blob-2"></div>
  <div class="bg-blur blob-3"></div>

  <div class="container">
    <header class="header">
      <div class="header-top">
        <!-- Updated title and added current date -->
        <h1 class="main-title">
          <span class="title-icon">📅</span>
          2026 Habit Calendar
        </h1>
        <div class="current-date-time">
          <div id="currentDateTime"></div>
        </div>
        <div class="header-stats">
          <div class="stat-card">
            <div class="stat-label">Current Streak</div>
            <div class="stat-value" id="currentStreak">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Total Habits</div>
            <div class="stat-value" id="totalHabits">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Completion Rate</div>
            <div class="stat-value" id="completionRate">0%</div>
          </div>
        </div>
      </div>
      
      <div class="controls-panel">
        <!-- Added month and year selector -->
        <div class="control-group">
          <label class="control-label">
            <span class="label-icon">📆</span>
            Month:
          </label>
          <select id="monthSelect" class="control-select">
            <option value="0">January</option>
            <option value="1">February</option>
            <option value="2">March</option>
            <option value="3">April</option>
            <option value="4">May</option>
            <option value="5">June</option>
            <option value="6">July</option>
            <option value="7">August</option>
            <option value="8">September</option>
            <option value="9">October</option>
            <option value="10">November</option>
            <option value="11">December</option>
          </select>
        </div>
        
        <div class="control-group">
          <label class="control-label">
            <span class="label-icon">🗓️</span>
            Year:
          </label>
          <input id="yearInput" type="number" value="2026" min="2020" max="2030" class="control-input">
        </div>
        
        <button id="viewAllMonthsBtn" class="btn btn-secondary">
          <span>📊</span> View All Months
        </button>
        <button id="saveDataBtn" class="btn btn-primary">
          <span>💾</span> Save Progress
        </button>
      </div>
    </header>

    <main class="main-content">
      <!-- Habit Input Section -->
      <section class="habit-input-section">
        <div class="section-header">
          <h2 class="section-title">Manage Habits</h2>
        </div>
        <div class="habit-controls">
          <input id="newHabitInput" placeholder="Enter habit name (e.g., Morning Walk, Yoga)" class="habit-input" />
          <button id="addHabitBtn" class="btn btn-accent">
            <span>➕</span> Add Habit
          </button>
        </div>
      </section>

      <!-- Calendar View Section -->
      <section class="habit-table-section">
        <div class="section-header">
          <h2 class="section-title" id="monthYearTitle">January 2026</h2>
          <div class="legend-indicators">
            <span class="legend-item"><span class="legend-dot sunday"></span> Sunday (Holiday)</span>
            <span class="legend-item"><span class="legend-dot festival"></span> Festival</span>
            <span class="legend-item"><span class="legend-dot today"></span> Today</span>
          </div>
        </div>
        <div class="table-wrap">
          <table id="habitTable" class="habit-table">
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
            <tfoot id="tableFoot"></tfoot>
          </table>
        </div>
      </section>

      <!-- Analytics Section -->
      <section class="analytics-section">
        <div class="section-header">
          <h2 class="section-title">Progress Analytics</h2>
          <div class="time-period-tabs">
            <button class="tab-btn active" data-period="daily">Daily</button>
            <button class="tab-btn" data-period="weekly">Weekly</button>
            <button class="tab-btn" data-period="monthly">Monthly</button>
            <button class="tab-btn" data-period="yearly">Yearly</button>
          </div>
        </div>

        <!-- Graph Container -->
        <div class="graph-panel">
          <div class="graph-header">
            <h3 class="graph-title" id="graphTitle">Monthly Progress</h3>
            <div class="graph-summary" id="graphSummary"></div>
          </div>
          
          <div id="graphContainer" class="graph-container"></div>
          
          <div class="graph-legend">
            <div class="legend-item">
              <span class="legend-color" style="background: linear-gradient(90deg, #06b6d4, #44d69e);"></span>
              <span>Completion Percentage</span>
            </div>
          </div>
        </div>


        <!-- Activities Redirect Section -->
<section class="activities-redirect-section" style="text-align:center; margin: 30px 0;">
  <a href="activities.html" style="text-decoration: none;">
    <button class="btn btn-accent">
      <span>📝</span> Go to Activities
    </button>
  </a>
</section>

        <!-- Detailed Stats -->
        <div class="stats-grid">
          <div class="stat-box">
            <div class="stat-box-icon">🎯</div>
            <div class="stat-box-content">
              <div class="stat-box-label">Best Habit</div>
              <div class="stat-box-value" id="bestHabit">-</div>
            </div>
          </div>
          
          <div class="stat-box">
            <div class="stat-box-icon">📈</div>
            <div class="stat-box-content">
              <div class="stat-box-label">Avg Monthly Completion</div>
              <div class="stat-box-value" id="avgCompletion">0%</div>
            </div>
          </div>
          
          <div class="stat-box">
            <div class="stat-box-icon">🔥</div>
            <div class="stat-box-content">
              <div class="stat-box-label">Most Consistent</div>
              <div class="stat-box-value" id="mostConsistent">-</div>
            </div>
          </div>
          
          <div class="stat-box">
            <div class="stat-box-icon">⏰</div>
            <div class="stat-box-content">
              <div class="stat-box-label">Total Check-ins</div>
              <div class="stat-box-value" id="totalCheckins">0</div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
